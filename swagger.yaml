openapi: 3.0.3
info:
  title: Duolabs API
  description: API for managing courses, users, and enrollments
  version: 1.0.0

servers:
  - url: http://localhost:8081

paths:
  /register:
    post:
      summary: Register a new user
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: invalid JSON
        "409":
          description: name already taken

  /login:
    post:
      summary: Login and get a JWT token
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: invalid JSON
        "401":
          description: invalid credentials

  /courses:
    get:
      summary: List all courses
      operationId: getAllCourses
      responses:
        "200":
          description: List of courses ordered by creation date descending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
    post:
      summary: Create a new course
      operationId: createCourse
      description: Admin only.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCourseRequest"
      responses:
        "201":
          description: Course created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "400":
          description: invalid JSON
        "401":
          description: unauthorized
        "403":
          description: forbidden (admin only)

  /courses/{id}:
    get:
      summary: Get a course by ID
      operationId: getCourseByID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Course found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "400":
          description: invalid course id
        "404":
          description: not found
    put:
      summary: Update a course
      operationId: updateCourse
      description: Admin only.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCourseRequest"
      responses:
        "200":
          description: Course updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "400":
          description: invalid course id or invalid JSON
        "401":
          description: unauthorized
        "403":
          description: forbidden (admin only)
        "404":
          description: not found
    delete:
      summary: Delete a course
      operationId: deleteCourse
      description: Admin only.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Course deleted
        "400":
          description: invalid course id
        "401":
          description: unauthorized
        "403":
          description: forbidden (admin only)
        "404":
          description: not found

  /courses/{id}/progress:
    get:
      summary: Progress of the authenticated user in a course
      operationId: getCourseProgress
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lessons completed so far
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseProgress"
        "401":
          description: unauthorized
        "404":
          description: not found

  /lessons/{id}/answer:
    post:
      summary: Answer a lesson (the user must be enrolled in its course)
      operationId: answerLesson
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerRequest"
      responses:
        "200":
          description: Graded answer. A correct answer completes the lesson for good.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerResponse"
        "400":
          description: invalid JSON or choice that does not belong to the lesson
        "401":
          description: unauthorized
        "403":
          description: not enrolled in this course
        "404":
          description: lesson not found

  /enrollments:
    get:
      summary: List all enrollments
      operationId: getAllEnrollments
      responses:
        "200":
          description: List of all enrollments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Enrollment"
    post:
      summary: Enroll in a course
      operationId: enroll
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollRequest"
      responses:
        "201":
          description: Enrolled successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
        "400":
          description: invalid JSON
        "401":
          description: unauthorized
        "409":
          description: already enrolled

  /enrollments/{id}:
    delete:
      summary: Unenroll from a course
      operationId: unenroll
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Unenrolled successfully
        "400":
          description: invalid enrollment id
        "401":
          description: unauthorized
        "404":
          description: not found

  /enrollments/user/{user_id}:
    get:
      summary: List courses for a user
      operationId: getEnrollmentsByUser
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of courses the user is enrolled in
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
        "400":
          description: invalid user id

  /enrollments/course/{course_id}:
    get:
      summary: List users enrolled in a course
      operationId: getEnrollmentsByCourse
      parameters:
        - name: course_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of users enrolled in the course
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "400":
          description: invalid course id

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          type: string
          enum: [admin, user]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true

    Course:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        xp:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true
        units:
          type: array
          description: Only returned by GET /courses/{id}
          items:
            $ref: "#/components/schemas/Unit"

    Enrollment:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        course_id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true

    RegisterRequest:
      type: object
      required:
        - name
        - password
      properties:
        name:
          type: string
        password:
          type: string

    LoginRequest:
      type: object
      required:
        - name
        - password
      properties:
        name:
          type: string
        password:
          type: string

    TokenResponse:
      type: object
      properties:
        token:
          type: string

    CreateCourseRequest:
      type: object
      required:
        - title
        - xp
      properties:
        title:
          type: string
        xp:
          type: integer
        units:
          type: array
          description: Optional content tree (units > tasks > lessons > choices)
          items:
            $ref: "#/components/schemas/Unit"

    UpdateCourseRequest:
      type: object
      required:
        - title
        - xp
      properties:
        title:
          type: string
        xp:
          type: integer

    EnrollRequest:
      type: object
      required:
        - course_id
      properties:
        course_id:
          type: integer
    CourseProgress:
      type: object
      properties:
        course_id:
          type: integer
        total_lessons:
          type: integer
        completed_lessons:
          type: integer
        completed:
          type: boolean
        xp_earned:
          type: integer
          description: The course xp once every lesson is completed, otherwise 0
        completed_lesson_ids:
          type: array
          items:
            type: integer
    AnswerRequest:
      type: object
      required: [choice_id]
      properties:
        choice_id:
          type: integer
    AnswerResponse:
      type: object
      properties:
        correct:
          type: boolean
    Choice:
      type: object
      required: [label]
      properties:
        id:
          type: integer
        label:
          type: string
        correct:
          type: boolean
          description: Input for admins. Only returned by GET /courses/{id} to admins; omitted for everyone else.
    Lesson:
      type: object
      required: [question, choices]
      description: Needs at least 2 choices and exactly 1 with correct=true.
      properties:
        id:
          type: integer
        question:
          type: string
        choices:
          type: array
          items:
            $ref: "#/components/schemas/Choice"
    Task:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        lessons:
          type: array
          items:
            $ref: "#/components/schemas/Lesson"
    Unit:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"
